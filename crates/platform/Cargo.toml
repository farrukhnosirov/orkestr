[package]
name = "orkestr-platform"
description = "Orkestr platform layer (§46): paths, process, shells, credential store, notifications, autostart, power, resources. All #[cfg(target_os)] code lives here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orkestr-domain.workspace = true
directories.workspace = true
keyring.workspace = true
sysinfo.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "macros", "rt"] }
tracing.workspace = true
# Vosk runtime is loaded at run time (ADR-0046); the only FFI besides power.
libloading = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# WebView2 settings of the desktop shell's windows (feature `webview2`; same
# versions as Tauri's wry, so nothing new is compiled into the desktop app).
webview2-com = { version = "0.39", optional = true }
windows-core = { version = "0.62", optional = true }

[features]
# Enables `webview_shell::webview2` (used by `orkestr-desktop` only).
webview2 = ["dep:webview2-com", "dep:windows-core"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
