[package]
name = "orkestr-gateway"
description = "Orkestr self-hosted gateway / control plane: accounts (passkey + TOTP), device registry, core enrollment, E2E tunnel relay, sync store, Web Push + native FCM/APNs delivery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "orkestr_gateway"
path = "src/lib.rs"

[[bin]]
name = "orkestr-gateway"
path = "src/bin/orkestr-gateway.rs"

[dependencies]
orkestr-domain.workspace = true
orkestr-protocol.workspace = true
orkestr-security.workspace = true
orkestr-sync.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
axum.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
base64.workspace = true
hex.workspace = true
rand.workspace = true
rand_core06.workspace = true
subtle.workspace = true
zeroize.workspace = true
p256.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
hmac.workspace = true
sha1.workspace = true
hkdf.workspace = true
ciborium.workspace = true
parking_lot.workspace = true
# FCM HTTP v1 service-account JWT (RS256), Phase 5 / ADR-0037.
rsa = { version = "0.9", features = ["sha2"] }

[dev-dependencies]
orkestr-core.workspace = true
orkestr-events.workspace = true
orkestr-node.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
aes-gcm.workspace = true
# h2c mock APNs server in tests.
axum = { workspace = true, features = ["http2"] }

[lints]
workspace = true
