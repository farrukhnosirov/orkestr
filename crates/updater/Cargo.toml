[package]
name = "orkestr-updater"
description = "Orkestr app updates (ADR-0048): update settings, release manifests (Tauri latest.json), signature verification, remote/local update checks, downloads, pre-update data backups and the data-schema downgrade guard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# Release tooling (scripts/release/build-installer.ps1): signs installers with
# the updater key and writes `latest.json`. Not shipped with the app.
name = "orkestr-release"
path = "src/bin/orkestr-release.rs"
test = false

[dependencies]
orkestr-platform.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
reqwest.workspace = true
semver.workspace = true
url = "2"
base64.workspace = true
zip.workspace = true
# The SQLite online-backup API (`rusqlite::backup`) for consistent copies of live databases.
rusqlite = { workspace = true, features = ["backup"] }
# Same signature format as tauri-plugin-updater (minisign, Ed25519).
minisign-verify = "0.3"
# Signing (release tool only); pure Rust, reads Tauri's password-protected key format.
minisign = "0.10"

[dev-dependencies]
tempfile.workspace = true
axum.workspace = true
anyhow.workspace = true

[lints]
workspace = true
