# Example Orkestr code plugin (ABI v1). Not a workspace member.
#
#   rustup target add wasm32-unknown-unknown
#   cargo build --release --target wasm32-unknown-unknown
#   -> target/wasm32-unknown-unknown/release/hello_tool.wasm (copy as plugin.wasm
#      next to orkestr-plugin.json and pack/sign with orkestr_plugins::package::build).
[package]
name = "hello-tool"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
orkestr-plugin-sdk = { path = "../../../crates/plugin-sdk" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[workspace]
