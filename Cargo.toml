[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Orkestr contributors"]
repository = "https://github.com/orkestr/orkestr"
publish = false

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
# --- internal crates ---------------------------------------------------------
orkestr-domain = { path = "crates/domain" }
orkestr-protocol = { path = "crates/protocol" }
orkestr-events = { path = "crates/events" }
orkestr-storage = { path = "crates/storage" }
orkestr-platform = { path = "crates/platform" }
orkestr-security = { path = "crates/security" }
orkestr-providers = { path = "crates/providers" }
orkestr-task-engine = { path = "crates/task-engine" }
orkestr-agent-runtime = { path = "crates/agent-runtime" }
orkestr-orchestrator = { path = "crates/orchestrator" }
orkestr-context = { path = "crates/context" }
orkestr-memory = { path = "crates/memory" }
orkestr-vcs = { path = "crates/vcs" }
orkestr-terminal = { path = "crates/terminal" }
orkestr-snapshots = { path = "crates/snapshots" }
orkestr-cost = { path = "crates/cost" }
orkestr-sync = { path = "crates/sync" }
orkestr-node = { path = "crates/node" }
orkestr-core = { path = "crates/core" }
orkestr-files = { path = "crates/files" }
orkestr-quality = { path = "crates/quality" }
orkestr-insight = { path = "crates/insight" }
orkestr-extensions = { path = "crates/extensions" }

# --- async ---------------------------------------------------------------------
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"

# --- serialization / errors / logging -----------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# --- data types ------------------------------------------------------------------
uuid = { version = "1.18", features = ["v7", "serde"] }
chrono = { version = "0.4.41", default-features = false, features = ["serde", "clock", "std"] }
ts-rs = { version = "12", features = ["serde-compat", "chrono-impl", "uuid-impl", "serde-json-impl"] }
schemars = { version = "1" }

# --- network ---------------------------------------------------------------------
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-tungstenite = "0.27"

# --- storage / crypto --------------------------------------------------------------
rusqlite = { version = "0.37", features = ["bundled"] }
blake3 = "1.8"
zstd = "0.13"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }
chacha20poly1305 = "0.10"
rand = "0.9"
base64 = "0.22"
subtle = "2.6"
hex = "0.4"
zeroize = "1.8"

# --- platform / system ------------------------------------------------------------
sysinfo = "0.37"
portable-pty = "0.9"
directories = "6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power"] }

# --- files / text ---------------------------------------------------------------------
ignore = "0.4"
regex = "1.11"
globset = "0.4"
notify = "8"
similar = "2.7"
tempfile = "3.20"

# --- concurrency ------------------------------------------------------------------------
parking_lot = "0.12"
dashmap = "6.1"
once_cell = "1.21"

# --- desktop shell ----------------------------------------------------------------------
tauri = { version = "2.8", features = [] }
tauri-build = { version = "2.4", features = [] }
tauri-plugin-single-instance = "2.5"

[profile.dev]
# Keep debug builds reasonably fast while making deps quick at runtime.
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
